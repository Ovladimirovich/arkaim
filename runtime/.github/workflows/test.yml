name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install ruff pytest pytest-asyncio pytest-mock anyio httpx aiosqlite python-multipart

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -v
